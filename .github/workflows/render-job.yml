name: Render job

# Started by the app when she taps "Make reel". Not meant to be run by hand.

on:
  workflow_dispatch:
    inputs:
      job_id:
        description: "Job id from the app"
        required: true
        type: string
      app_url:
        description: "Address of the app"
        required: true
        type: string

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # The quick way: unpack the copy of ffmpeg and Pillow that an earlier run kept (a few seconds instead of
      # 20 to 45). With no copy to unpack, this step installs them itself and makes a copy.
      - name: Get ffmpeg and Pillow ready
        id: tools
        uses: ./.github/actions/render-tools
        continue-on-error: true

      # The long way, exactly as it was always done. Only runs if the step above failed for any reason at all,
      # so a reel is never lost to it.
      - name: Install ffmpeg and Pillow
        if: ${{ steps.tools.outcome != 'success' }}
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          pip install --quiet pillow

      - name: Render and send back
        # Inputs go through env vars so they can never be run as shell code.
        env:
          JOB_ID: ${{ inputs.job_id }}
          APP_URL: ${{ inputs.app_url }}
          RENDER_SECRET: ${{ secrets.RENDER_SECRET }}
        run: bash render/run_job.sh

      # Last, so the reel never waits for it: keep the fresh copy of the tools for the next run.
      - name: Keep the tools for next time
        if: ${{ !cancelled() && steps.tools.outputs.save == 'yes' }}
        continue-on-error: true
        uses: actions/cache/save@v5
        with:
          path: ~/render-tools
          key: ${{ steps.tools.outputs.key }}
